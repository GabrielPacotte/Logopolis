services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logopolis
      POSTGRES_USER: logopolis
      POSTGRES_PASSWORD: logopolis
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logopolis -d logopolis"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
