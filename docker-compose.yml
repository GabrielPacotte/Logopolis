services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: logopolis
      POSTGRES_USER: logopolis
      POSTGRES_PASSWORD: logopolis
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logopolis -d logopolis"]
      interval: 5s
      timeout: 5s
      retries: 10
