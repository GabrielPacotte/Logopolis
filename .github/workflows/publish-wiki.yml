name: Publish documentation to Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/publish-wiki.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WIKI_PUSH_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
    # The repository Wiki must be initialized and WIKI_PUSH_TOKEN must be a fine-grained
    # token able to write this repository's Wiki. Do not replace it with an over-privileged token.
    if: ${{ env.WIKI_PUSH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish docs as Wiki pages
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          git config --global user.name 'logopolis-docs-bot'
          git config --global user.email 'logopolis-docs-bot@users.noreply.github.com'
          git clone "https://x-access-token:${WIKI_PUSH_TOKEN}@github.com/${REPOSITORY}.wiki.git" wiki
          mkdir -p wiki/Logopolis
          rsync -a --delete docs/ wiki/Logopolis/
          cd wiki
          git add --all
          git diff --cached --quiet || git commit -m 'docs: publish repository documentation'
          git push
