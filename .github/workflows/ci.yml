name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and security baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: logopolis
          POSTGRES_USER: logopolis
          POSTGRES_PASSWORD: logopolis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logopolis -d logopolis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Formatting
        run: npm run format:check
      - name: Lint and architecture boundaries
        run: npm run lint
      - name: Type checking
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: API integration tests with PostgreSQL
        run: npm run test:integration
      - name: API integration tests without PostgreSQL
        run: npm run test:integration:unready
      - name: Documentation links
        run: npm run check:docs
      - name: Agent governance
        run: npm run check:agent-governance
      - name: Secret scan
        run: npm run check:secrets
      - name: Dependency audit
        run: npm run audit
