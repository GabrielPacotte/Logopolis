name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and security baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      PORT: 3333
      HOST: 127.0.0.1
      LOG_LEVEL: error
      APP_NAME: Logopolis CI
      APP_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      APP_URL: http://localhost:3333
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: logopolis
      DB_PASSWORD: logopolis
      DB_DATABASE: logopolis
      WEB_ORIGIN: http://localhost:3000
      MAIL_FROM_ADDRESS: no-reply@logopolis.test
      MAIL_FROM_NAME: Logopolis CI
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: logopolis
          POSTGRES_USER: logopolis
          POSTGRES_PASSWORD: logopolis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logopolis -d logopolis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Formatting
        run: npm run format:check
      - name: Lint and architecture boundaries
        run: npm run lint
      - name: Type checking
        run: npm run typecheck
      - name: Foundation unit tests
        run: npm test
      - name: API unit tests
        run: npm run test:unit --workspace=api
      - name: Apply API migrations
        env:
          DB_PORT: 5432
          WEB_ORIGIN: http://localhost:3000
          MAIL_FROM_ADDRESS: no-reply@logopolis.test
          MAIL_FROM_NAME: Logopolis CI
        run: npm run migration:run --workspace=api
      - name: API integration tests with PostgreSQL
        env:
          DB_PORT: 5432
          WEB_ORIGIN: http://localhost:3000
          MAIL_FROM_ADDRESS: no-reply@logopolis.test
          MAIL_FROM_NAME: Logopolis CI
        run: npm run test:integration
      - name: API integration tests without PostgreSQL
        env:
          WEB_ORIGIN: http://localhost:3000
          MAIL_FROM_ADDRESS: no-reply@logopolis.test
          MAIL_FROM_NAME: Logopolis CI
        run: npm run test:integration:unready
      - name: Build Web application
        run: npm run build --workspace=web
      - name: Build API application
        run: npm run build --workspace=api
      - name: Start local services for browser E2E
        env:
          MAILPIT_HOST: 127.0.0.1
          MAILPIT_PORT: 1025
        run: |
          (cd apps/api && NODE_ENV=development node build/bin/server.js > /tmp/logopolis-api-e2e.log 2>&1 &)
          (NODE_ENV=production PORT=3000 npm run start --workspace=web > /tmp/logopolis-web-e2e.log 2>&1 &)
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3333/health/live >/dev/null && curl --fail --silent http://localhost:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/logopolis-api-e2e.log /tmp/logopolis-web-e2e.log
          exit 1
      - name: Browser E2E with Mailpit
        env:
          NODE_ENV: development
          E2E_WEB_URL: http://localhost:3000
          E2E_MAILPIT_URL: http://127.0.0.1:8025
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Documentation links
        run: npm run check:docs
      - name: Agent governance
        run: npm run check:agent-governance
      - name: Secret scan
        run: npm run check:secrets
      - name: Dependency audit
        run: npm run audit
